<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The licence page moved to /license/. This is left at the old address so
     a bookmark, a link somebody shared, and the search results that still
     list it all arrive there.

     A page rather than a redirect rule in render.yaml, for a reason worth
     knowing before deleting it: Render skips a redirect rule whenever a file
     exists at the path, and applies render.yaml at all only if the service
     is managed as a Blueprint -- which is not certain for this one. An
     instant refresh works either way, and Google reads one as a permanent
     move, the same as a 301. Not in the sitemap, and not to be indexed: the
     canonical says where the page lives now. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  style-src 'self';
  img-src 'self';
  base-uri 'none';
  form-action 'none'">
<meta http-equiv="refresh" content="0; url=/license/">
<link rel="canonical" href="https://blinded.dev/license/">
<meta name="robots" content="noindex">
<title>Blinded License – moved</title>
<link rel="stylesheet" href="/app.css">
</head>
<body class="plainpage">
<main class="wrap">
  <p>This page is now at <a href="/license/">blinded.dev/license</a>.</p>
</main>
</body>
</html>

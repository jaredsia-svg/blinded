# How the canonical copy is served.
#
# blinded.dev is the one address, and it has to stay the one address. The
# service also answers on its blinded.onrender.com hostname, and two hostnames
# serving the same bytes is the same page at two URLs: a crawler has to pick
# one and discount the other, and the markup's rel="canonical" says which,
# but only to the crawlers that honour it. Set blinded.dev as the primary
# custom domain in Render (Settings -> Custom Domains); Render then sends a
# 301 from the onrender hostname to it, which settles it for everything.
#
# GitHub Pages publishing is off, for the same reason and a worse one: two
# origins serving the same app meant two sets of response headers, and the
# Pages one sent Access-Control-Allow-Origin: * and nothing about framing.
#
# The headers here are the half of the app's defences that a page cannot state
# about itself. index.html carries a meta Content-Security-Policy, and a meta
# policy is honoured for everything except frame-ancestors — the one directive
# that has to arrive before the document does, because by the time the markup
# is parsed the framing has already happened. So it is sent here, with the
# rest of the policy repeated so the two cannot drift into disagreeing about
# what the page may reach.
#
# This file governs the service only if Render is managing it as a Blueprint.
# A service created by hand in the dashboard ignores it — set the same headers
# under Settings -> Headers there, or connect the blueprint.
services:
  - type: web
    name: blinded
    runtime: static
    staticPublishPath: .
    buildCommand: ""
    headers:
      - path: /*
        name: Content-Security-Policy
        value: >-
          default-src 'self';
          script-src 'self' 'unsafe-eval';
          style-src 'self' 'unsafe-inline';
          img-src 'self' data: blob:;
          connect-src 'self' blob:;
          worker-src 'self' blob:;
          frame-src 'none';
          frame-ancestors 'none';
          object-src 'none';
          base-uri 'none';
          form-action 'none'
      # The buying page, and only the buying page.
      #
      # Taking a card needs a payment processor's script, its frames and its
      # network calls. Those permissions are granted here, on a page that
      # never opens a document, and nowhere else -- so the policy over the
      # page that does hold a document is exactly what it was before there
      # was anything to buy. A path rule wins over the /* one above it.
      #
      # This is the whole reason buying happens in a second window rather
      # than inside the tool.
      - path: /unlock.html
        name: Content-Security-Policy
        value: >-
          default-src 'self';
          script-src 'self' https://cdn.paddle.com;
          style-src 'self' 'unsafe-inline';
          img-src 'self' data: https://*.paddle.com;
          connect-src 'self' https://*.paddle.com https://blinded-mint.onrender.com;
          frame-src https://*.paddle.com;
          frame-ancestors 'none';
          object-src 'none';
          base-uri 'none';
          form-action 'none'
      # Paddle's overlay opens windows and reads back from them, which a
      # same-origin opener policy forbids.
      - path: /unlock.html
        name: Cross-Origin-Opener-Policy
        value: same-origin-allow-popups
      # Once a browser has seen this it will not be talked into http for a
      # year, which closes the one window where a document could be read off
      # the wire: the first plain request a typed address makes, before the
      # redirect. Render serves this over TLS on every hostname it answers on,
      # so there is nothing left that needs http.
      # Revalidate before reusing anything.
      #
      # Without this the browser decides for itself how long to keep a page,
      # and it keeps the HTML. The asset links inside carry ?v=<hash> so a
      # changed script gets a new URL -- but that only helps once the markup
      # holding those links has itself been fetched again. Held HTML against a
      # fresh script is the worst of the two: the page draws a button whose
      # handler looks for markup that release does not have, so it does
      # nothing at all, silently, and a hard reload is the only cure.
      #
      # no-cache does not mean do not store: it means ask first. An unchanged
      # file comes back 304 with no body, so this costs a round trip and not a
      # download, and the versioned URLs make that answer cheap.
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      # Older browsers that do not read frame-ancestors.
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      # The file name a reviewer opens can itself be confidential, and it can
      # end up in a URL. Nothing here needs a referrer.
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      # None of these are used by the tool, so none of them are available to
      # anything that ends up running in the page.
      - path: /*
        name: Permissions-Policy
        value: accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=(), interest-cohort=()
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Cross-Origin-Resource-Policy
        value: same-origin
      # Except the picture that stands in for a link to this. It is meant to
      # be shown by somebody else's page -- that is its whole job -- and
      # same-origin is an instruction to the browser not to let them. Nothing
      # about it is confidential: it is two slides from the gallery, already
      # public, drawn into a card.
      - path: /og.png
        name: Cross-Origin-Resource-Policy
        value: cross-origin
